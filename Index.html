/* FILEIRAS COM SETAS E CARDS MAIS COMPACTOS NO CELULAR */
@media(max-width:500px){
  .titulo{position:relative;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .dicaLado{margin-left:auto;font-size:11px;font-weight:700;color:#42bfff;opacity:.9;animation:piscadaLado 1.4s infinite}
  .listaWrap{position:relative;width:100%;display:flex;align-items:center;min-width:0}
  .listaWrap .lista{width:100%}
  .seta{position:absolute;top:50%;transform:translateY(-55%);z-index:20;width:32px;height:58px;border:2px solid #168cff;border-radius:10px;background:rgba(0,80,170,.82);color:#fff;font-size:38px;line-height:45px;padding:0;box-shadow:0 0 12px rgba(22,140,255,.9);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .setaEsq{left:-2px}
  .setaDir{right:-2px}
  .card{height:270px !important;min-height:270px !important;padding:8px !important;border-radius:10px !important;box-sizing:border-box !important}
  .card img{height:95px !important;margin-bottom:8px !important;border-radius:8px !important}
  .card h3{font-size:13px !important;line-height:1.15 !important;margin:4px 0 7px !important;max-height:46px !important;overflow:hidden !important}
  .card a{font-size:12px !important;padding:8px !important;margin-top:auto !important}
  .apagar{font-size:12px !important;padding:8px !important;margin-top:6px !important}
}
@keyframes piscadaLado{50%{opacity:.45}}

/* CORREÇÃO HORIZONTAL NO CELULAR - SOMENTE AS FILEIRAS */
@media(max-width:500px){
  html,body{
    overflow-x:hidden !important;
    overflow-y:auto !important;
    height:auto !important;
    min-height:100% !important;
    touch-action:pan-y !important;
  }
  #site{
    overflow:visible !important;
  }
  .container{
    overflow:visible !important;
  }
  .lista{
    display:flex !important;
    flex-direction:row !important;
    flex-wrap:nowrap !important;
    align-items:stretch !important;
    justify-content:flex-start !important;
    width:100% !important;
    max-width:100% !important;
    overflow-x:auto !important;
    overflow-y:hidden !important;
    gap:16px !important;
    column-gap:16px !important;

const firebaseConfig={apiKey:"AIzaSyDrphlYPSBiqAbaygmI8f2T4dC2LbreocY",authDomain:"bala-channel-novo.firebaseapp.com",projectId:"bala-channel-novo",storageBucket:"bala-channel-novo.firebasestorage.app",messagingSenderId:"288618173632",appId:"1:288618173632:web:1e909b4bef684f577c0925",measurementId:"G-7NBG47078C"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),auth=firebase.auth(),ADMIN_EMAIL="gustavopsp222@gmail.com";let grupos=[];

function carregar(){db.collection("grupos").onSnapshot(s=>{grupos=[];s.forEach(d=>grupos.push({id:d.id,...d.data()}));mostrar()},()=>{for(const id of ["principalLista","afiliadoLista","canalLista"])document.getElementById(id).innerHTML='<div class="vazio">⚠️ Não foi possível carregar.</div>'})}window.apagarGrupo=function(id){if(!confirm("Tem certeza que quer apagar esse grupo/canal? 🗑️"))return;db.collection("grupos").doc(id).delete().then(()=>alert("🗑️ Apagado!")).catch(e=>alert("❌ Erro: "+e.message))};

<style>
/* ANIMAÇÃO AO TOCAR NOS CARDS */
.card{
  transform:translateZ(0);
  transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;
  will-change:transform;
}
.card.cardClicado{
  animation:cardCongeladoClique .42s ease both;
}
@keyframes cardCongeladoClique{
  0%{transform:scale(1);filter:brightness(1)}
  35%{transform:scale(.94) rotate(-1deg);filter:brightness(1.45) saturate(1.25)}
  65%{transform:scale(1.035) rotate(1deg);filter:brightness(1.2) saturate(1.18)}
  100%{transform:scale(1) rotate(0);filter:brightness(1) saturate(1)}
}
.card::selection{background:transparent}
</style>

<script>
/* Clique/touch com efeito de impacto congelado */
document.addEventListener('pointerdown',function(e){
  const card=e.target.closest('.card');
  if(!card) return;
  card.classList.remove('cardClicado');
  void card.offsetWidth;
  card.classList.add('cardClicado');
  setTimeout(function(){card.classList.remove('cardClicado')},450);
},{passive:true});
</script>
